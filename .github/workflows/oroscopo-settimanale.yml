name: Oroscopo settimanale

on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch: {}

jobs:
  invia:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama endpoint oroscopo settimanale
        run: |
          curl -sS -X POST "https://luna2-api.onrender.com/cron/oroscopo-settimanale" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 600
