<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

        @page {
            size: A4;
            margin: 2cm 2.5cm;
            @bottom-center { content: counter(page); font-family: 'Cinzel', serif; font-size: 10pt; color: #b89752; }
            @top-center { content: "Il Cielo di {{NOME_CLIENTE}} 2027"; font-family: 'Cinzel', serif; font-size: 9pt; color: #a0a0a0; letter-spacing: 2px; }
        }
        
        @page cover { margin: 0; @bottom-center { content: none; } @top-center { content: none; } }

        body { margin: 0; padding: 0; font-family: 'Playfair Display', serif; background-color: #fcfbf7; }

        .copertina { page: cover; page-break-after: always; width: 100%; height: 100vh; background-color: #0d1321; background-image: radial-gradient(circle at 50% 50%, rgba(28, 42, 75, 0.8) 0%, rgba(13, 19, 33, 1) 80%); box-sizing: border-box; border-left: 20px solid #060910; position: relative; }
        .cornice { position: absolute; top: 40px; bottom: 40px; left: 40px; right: 40px; border: 2px solid #b89752; box-shadow: inset 0 0 0 6px #0d1321, inset 0 0 0 8px #b89752; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 40px; }
        
        /* NUOVA COPERTINA */
        .riga-copertina-1 { font-family: 'Cinzel', serif; font-size: 32pt; color: #ffd700; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 10px; }
        .riga-copertina-2 { font-size: 40pt; font-style: italic; color: #ffffff; margin-bottom: 10px; border-bottom: 1px solid #b89752; padding-bottom: 10px; min-width: 60%; }
        .riga-copertina-3 { font-family: 'Cinzel', serif; font-size: 36pt; color: #e2c792; letter-spacing: 5px; margin-bottom: 60px; }
        .simbolo-centrale { font-size: 60pt; color: #b89752; margin-bottom: 40px; }
        .dedicato-da { font-family: 'Playfair Display', serif; font-size: 16pt; font-style: italic; color: #a0a0a0; margin-top: 20px; border-top: 1px solid #b89752; padding-top: 20px; width: 60%; }

        .capitolo { page-break-before: always; color: #1a1a1a; }
        .capitolo h2 { font-family: 'Cinzel', serif; font-size: 22pt; color: #0d1321; text-align: center; border-bottom: 2px solid #b89752; padding-bottom: 10px; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; }
        .capitolo p { font-size: 11pt; line-height: 1.7; text-align: justify; margin-bottom: 15px; }

        /* DEDICA (Testo ingrandito e firma ridotta) */
        .dedica { text-align: center; margin-top: 50px; }
        .simbolo-segno { font-size: 100pt; color: #b89752; margin-bottom: 20px; line-height: 1; }
        .testo-dedica { font-size: 18pt; font-style: italic; line-height: 1.9; color: #333; margin-bottom: 20px; }
        .firma-dedica { font-size: 16pt !important; color: #0d1321; font-style: italic; font-weight: bold; }

        /* BOX CHE NON SI SPEZZANO */
        .box-identita { 
            background: #ffffff; 
            border: 1px solid #e0d5c1; 
            border-left: 5px solid #b89752; 
            border-radius: 4px; 
            padding: 20px; 
            margin-bottom: 25px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            page-break-inside: avoid;
        }
        .box-identita .simbolo-grande { font-size: 30pt; color: #b89752; float: left; margin-right: 15px; margin-top: -5px; }
        .box-identita .titolo-box { font-family: 'Cinzel', serif; font-size: 14pt; color: #0d1321; margin-bottom: 8px; display: block; }

        /* TABELLE E RUOTA */
        table.dati { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 10pt; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); page-break-inside: avoid; }
        table.dati th, table.dati td { border-bottom: 1px solid #ddd; padding: 8px 12px; text-align: left; }
        table.dati th { font-family: 'Cinzel', serif; color: #0d1321; background: #f8f6f0; text-transform: uppercase; font-size: 9pt; letter-spacing: 1px; }

        /* CENTRATURA RUOTA */
        .ruota-container { display: flex; justify-content: center; width: 100%; margin: 30px 0; page-break-inside: avoid; }
        .ruota-svg { width: 100%; max-width: 450px; margin: 0 auto; display: block; }

        .indice { page-break-after: always; }
        .indice h2 { font-family: 'Cinzel', serif; font-size: 22pt; color: #0d1321; text-align: center; border-bottom: 2px solid #b89752; padding-bottom: 10px; margin-bottom: 30px; }
        .indice ul { list-style: none; padding: 0; }
        .indice li { font-size: 13pt; margin-bottom: 12px; color: #1a1a1a; border-bottom: 1px dotted #ccc; padding-bottom: 5px; }
    </style>
</head>
<body>
    <div class="copertina">
        <div class="cornice">
            <div class="riga-copertina-1">Il Cielo di</div>
            <div class="riga-copertina-2">{{NOME_CLIENTE}}</div>
            <div class="riga-copertina-3">2027</div>
            <div class="simbolo-centrale">✦</div>
            <div class="dedicato-da">Dedicato da tuFelia</div>
        </div>
    </div>

    <div class="indice capitolo">
        <h2>Indice</h2>
        <ul>
            <li>Dedica e Introduzione</li>
            <li>La Tua Ruota e i Tuoi Dati</li>
            <li>Parte I - La tua identità astrologica</li>
            <li>Parte II - Il tuo 2027: il quadro generale</li>
            <li>Parte III - I dodici mesi del 2027</li>
            <li>Parte IV - I grandi ambiti della tua vita</li>
        </ul>
    </div>

    <div id="contenuto"></div>
</body>
</html>
